  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/addons/",

  "./js/data.js": "./js/data.js?v=3",
  "./js/level.js": "./js/level.js?v=3",
  "./js/map.js": "./js/map.js?v=3",
  "./js/player.js": "./js/player.js?v=3",
  "./js/robot.js": "./js/robot.js?v=3",
  "./js/splat.js": "./js/splat.js?v=3",
  "./js/textures.js": "./js/textures.js?v=3",

</head>
<body>
<canvas id="view"></canvas>
<div id="eyeL" class="eye-ov left"></div>
<div id="eyeR" class="eye-ov right"></div>
<canvas id="ripples"></canvas>
<canvas id="splat"></canvas>

<div id="hud" hidden>
  <div id="watch"><span id="watchTime">00:00</span><span id="floorLbl"></span></div>
  <div id="memo"><span id="memoRange"></span></div>
  <div id="cross"><i></i>
    <svg class="hold" viewBox="0 0 40 40"><circle id="holdRing" cx="20" cy="20" r="15.9" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
  </div>
  <div id="lensCd"></div>
  <div class="stamWrap"><i id="stam"></i></div>
  <div id="caption"></div>
  <div id="prompt"></div>
  <div id="inv"></div>
  <div id="body"></div>
  <div id="candle"></div>
  <div id="floorFlash"></div>
  <canvas id="miniMap" width="168" height="168" hidden></canvas>
</div>
<canvas id="mapBig" hidden></canvas>

<div id="fade"></div>
<div id="collect" hidden></div>
<div id="panel" hidden><div id="panelBox"></div></div>
<div id="pause" hidden></div>
<div id="ending" hidden></div>
<div id="title" hidden></div>
<div id="nogl" hidden>이 브라우저에서는 3D 화면을 열 수 없어요. PC의 크롬, 엣지, 파이어폭스에서 열어 주세요.</div>

<script type="module" src="js/main.js?v=3"></script>

</html>
